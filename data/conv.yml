groups:
  mood: [depressed, sad, relaxed, happy]
  problem: [tired, stressed, bored]
  uncertainty: [unsure, stuck, motivated]

  ~reststatus: [justrested, nottired, stilltired]
  ~comforttry: [tryrest, trytask, nogeneric]
  ~workstatus: [justworked, starting]
  suggeststate: [resuggested]


initial: [2*sayhi, what2do]
reset: [sayhi, progress, what2do]


purposes:
  sayhi:
    # How is it going?
    - templates:
        "*":
          - "{$Hi}! How{2* are you/2* is it/'s it} $Going?"
          - "{$Hi}! How{'s/ is}{$ThisDay} $Going?"
          - "How{ are you/ is it/'s it} $Going{4*/$ThisDay}?"
          - "How{ is/'s}{3* everything/$ThisDay} $Going?"
          - "2*How has{$ThisDay} $Been?"
          - "How{'s/ is/ was} your {%time/day}?"
      opts:
        - ["{Pretty good/Great/Good/Nice}!", [happy], "{2*progress/encourage}"]
        - ["{2*Ok/2*Alright/Meh}", [], checkin]
        - ["$NotBest", [sad], checkin]
        - ["{2*Terrible/Awful}", [depressed], checkin]

    # What are you up to?
    - templates:
        "*":
          - "{$Hi}! I{'ve/ have} {just /}been %scene, what about you?"
          - "{$Hi}! I was {2*%scene/just %scene/%scene just now}, what {are/were} you {up to/doing}?"
          - "What {10*are /}you up to?"
          - "What {10*are /}you {working on/planning/doing} {right now/now/2*%thistime/today}?"
          - "What {2*are your plans/is the plan/'s the plan}{/5* for %thistime/2* %thistime}?"
      shuffle: true
      opts:
        - ["$Sleeping", [tired], comfort]
        - ["$Working", [motivated], encourage]
        - ["$Chilling", [relaxed], suggest]
        - ["{Nothing/Nothing much/Not much}", [unsure], suggest]
        - ["{2*Struggling/2*Wasting time/2*Getting nowhere/I'm stuck/Avoiding stuff/Procrastinating}", [sad], comfort]

    # What's up?
    - templates:
        "*":
          - "3*{$Hi/3*Good %time}! What's up?"
          - "{8*What's /Wass}up?"
          - "{$Hi}! Anything new?"
          - "What's {going on} today?"
      shuffle: true
      opts:
        - ["{Going pretty/2*Going/2*Pretty} {well/good/great}", [happy], "{2*progress/encourage}"]
        - ["{Nothing much/2*Not much/3*Nothing/Nothing new}", [], suggest]
        - ["$NotBest", [sad], checkin]
        - ["Going {poorly/terribly/awfully}", [depressed], checkin]
        - ["$Sleeping", [tired], comfort]
        - ["$Working", [motivated], encourage]
        - ["$Chilling", [relaxed], "{5*progress/comfort}"]
        - ["{The sky/The clouds/30*}", [], haha]
  haha:
    # Laugh at a joke
    - templates:
        "*":
          - "Ha{ha/ ha/}{! V/, v}ery funny{./!} $ButSeriously"
          - "Good one! $ButSeriously"
          - "Very funny{!/.} $ButSeriously"
      shuffle: true
      opts:
        - ["$NotBest", [sad], checkin]
        - ["{Mid/2*Ok/2*Fine/Not bad/3*}", [], "{suggest/encourage/checkin}"]
        - ["{Well/Great/Awesome}", [happy], progress]
        - ["$Sleeping", [tired], comfort]
        - ["$Working", [motivated], encourage]
        - ["$Chilling", [relaxed], progress]

  progress:
    # How's your work coming along?
    - templates:
        "*":
          - "How {8*are /}you {going/coming along/holding up/running}?"
          - "2*How{'s/ is} {the work/your work/it/it all/2*everything} $Going?"
          - "How are your {2*tasks/projects} $Going?"
      opts:
        - ["{Terribly/Poorly}", [depressed], checkin]
        - ["{No work/2*Aimless/2*Undecided/Lost}", [unsure], suggest]
        - ["Bored", [bored], suggest]
        - ["$Stuck", [stuck], comfort]
        - ["$NotBest", [sad], checkin]
        - ["{2*Ok/2*Alright/Meh/Getting there}", [], checkin]
        - ["{Smoothly/Excellent/Great/Well}!", [happy], encourage]

    # Done good work today?
    - templates:
        "!justworked":
          - "Are you managing to {get through stuff/survive work/do stuff/get stuff done} {%thistime/today}?"
        "*":
          - "How{'s/ is} {your /5*}work {going/coming along/treating you}? $DoneStuff"
          - "Is {your /5*}work {going good/going well/treating you well/being kind to you}{ %thistime/ today/}?"
          - "$DoneStuff"
        "happy":
          - "4*{Is y/Y}our {work/2*tasks/stuff/projects}"
          - "2*{Are y/Y}our {2*tasks/projects} $Going {5*well/nicely}?"
        "relaxed":
          - "4*{2*Is everything/Are the tasks/Is the work} going {smoothly/well/nicely}?"
      opts:
        - ["{Nothing to do/Got no work/Nothing on}", [], suggest]
        - ["{I wish/}", [unsure], "{2*suggest/comfort}"]
        - ["{Bored/5*}", [bored], suggest]
        - ["{Nope/None/No}", [], "{5*checkin/suggest}"]
        - ["{A bit/Not much}", [], "{2*suggest/comfort/checkin}"]
        - ["{Yup/Yeah/Yes/Heaps}!", [happy], encourage]

  what2do:
    # What do you want to do?
    - templates:
        "*":
          - "What do you {want to do/want to accomplish/feel like doing}{/ %thistime/ today/ now}?"
          - "What{'s your goal/ are your goals} {for /}{today/%thistime}?"
      opts:
        - ["Nothing", [], suggest]
        - ["$Struggle", [sad], checkin]
        - ["{Sleep/Rest/}", [tired], comfort]
        - ["$Unsure", [unsure], suggest]
        - ["{2*Work/2*Productivity/Good things}", [motivated], "{encourage/2*progress}"]

    # Is there anything you want to do?
    - templates:
        "*":
          - "{6*Is there a/A}nything you $WantDone{/ %thistime/ today/ now}?"
        "relaxed?happy":
          - "2*{Got a/A}nything you {want/would like} to $WantDone?"
      opts:
        - ["{No/Not really/Nope}", [], suggest]
        - ["$Struggle", [sad], checkin]
        - ["{Sleep/Rest/}", [tired], comfort]
        - ["$Unsure", [unsure], suggest]
        - ["{Yes/Yep/Definitely!}", [motivated], "{encourage/2*progress}"]

  checkin:
    # Why are you sad?
    - templates:
        "!happy, !relaxed":
          - "{What's/Anything} wrong?"
          - "Anything {troubling/bothering} you{right now/6*}?"
          - "2*{What's/Anything/What is} {the matter/on your mind}?"
        "depressed":
          - "5*What{'s/ is} {3*troubling/3*bothering/saddening/2*upsetting} you?"
      shuffle: true
      opts:
        - ["$Tired", [tired], comfort]
        - ["$Stressed", [stressed], comfort]
        - ["{Bored/Nothing to do}", [bored], suggest]
        - ["$Unsure", [unsure], "{suggest/comfort}"]
        - ["$Stuck", [stuck], comfort]
        - ["{Nothing/Nothing's wrong/I'm good/All good/All's good}", [-mood, -uncertainty], "$AllGoodOs"]

    # How are you going?
    - templates:
        "!depressed, !sad":
          - "How are things {going/coming along}?"
          - "3*How{ are you/ is it/'s it} {going/coming along/holding up}?"
          - "How{'s/ is} {life/the world/everything} treating you?"
      shuffle: true
      opts:
        - ["{Not/Not going} good", [sad]]
        - ["$Stuck", [stuck], comfort]
        - ["$Unsure", [unsure], suggest]
        - ["$Tired", [tired], "{suggest/comfort}"]
        - ["{2*Great/2*Awesome/2*Doing well/I've got this}!", [happy, -problem], "$AllGoodOs"]

    # Anything wrong?
    - templates:
        "sad?-mood":
          - "{Anything/Is something/Is anything} {2*wrong/off}?"
          - "{3*Are y/Y}ou {all /}good?"
      shuffle: true
      opts:
        - ["$Stuck", [stuck], comfort]
        - ["$Unsure", [unsure], "{3*suggest/comfort}"]
        - ["$Tired", [tired], comfort]
        - ["$Stressed", [stressed], comfort]
        - ["{Bored/Nothing to do}", [bored], suggest]
        - ["{All's good/Doing well}!", [happy, -problem], "$AllGoodOs"]

  comfort:
    # Maybe take a break?
    - templates:
        "tired":
          - "3*{Maybe take/Try taking} a $Quick{break/rest} if you're tired{./?}"
          - "3*$WantBreak?"
        "stressed?depressed":
          - "2*$WantBreak{? It might make you feel better./, it may help?/?}"
          - "Sounds like you need a break{. It might make you feel better./, it may help./, want one?/.}"
        "stressed?stuck":
          - "2*$AhNotBest Want a $Quick{break/rest} to help $ClearMind?"
      opts:
        - ["{3*Sure/I guess}", [], rest]
        - ["Maybe", [], rest]
        - ["{Won't help/Not helpful/Unhelpful/2*Useless}", [], stillTired]
        - ["{Don't want to/2*No/No thanks/Not now/Something else?}", [trytask], comfort2]

    # Maybe do something else?
    - templates:
        "stuck":
          - "3*$AhNotBest Want {a different goal/something else} to {2*help /}$ClearMind?"
        "depressed?stressed":
          - "2*{Sounds like/6*Do} you need something {new/different/more fun} to help $ClearMind?"
      opts:
        - ["{3*Sure/I guess}", [], "$RecommendOs"]
        - ["Maybe", [], suggest]
        - ["{Don't want to/2*No/No thanks/Not now/Something else?}", [tryrest], comfort2]

    # Be there for the user (generic)
    - templates:
        "+, !depressed, !nogeneric":
          - "I'm {so /9*}sorry{ ❤️/ :(/8*./8*/!}"
          - "It's {going to be /}ok{!/8*.}"
      opts:
        - ["{2*Thanks/2*I appreciate it/Ok/2*Yeah/Yeah, probably/2*Probably}", [], what2do]
        - ["{It's n/N}ot ok", [nogeneric]]

    # Fallback redirect
    - templates: { "=": ["> $RecommendOs"] }

  comfort2:
    - templates:
        "tryrest":
          - "$WantBreak?"
          - "What about a $Quick{break/rest}?"
      opts:
        - ["{3*Sure/I guess}", [], rest]
        - ["Maybe", [], rest]
        - ["{Won't help/Not helpful/Unhelpful/2*Useless}", [], stillTired]
        - ["{Don't want to/2*No/No thanks/Not now}", [unsure], what2do]

    - templates:
        "trytask":
          - "{2*Do you w/W}ant {a different goal/something else} to {help /}$ClearMind?"
          - "What about having {a different goal/something else} to work on to {help /}$ClearMind?"
      opts:
        - ["{3*Sure/I guess}", [], "$RecommendOs"]
        - ["Maybe", [], suggest]
        - ["{2*No/No thanks/Not now}", [unsure], what2do]

    # Fallback redirect
    - templates: { "=": ["> comfort"] }

  rest:
    - templates:
          "*":
            - "{Have a rest/Take a break} and come back {later/when you feel better}{!/.}"
      opts:
        - ["Done", [], afterRest]
        - ["{2*Still tired/Not helping/Not helpful}", [justrested], stillTired]
  afterRest:
    - templates:
        "*":
          - "2*{4*Are y/Y}ou feeling {any /}better{2*/ than before}?"
      opts:
        - ["{Yeah/Yes}", [~tired], what2do]
        - ["$ABit", [~tired], what2do]
        - ["{Still tired/Tired again}", [justrested], stillTired]
        - ["{No/Not much/Not really}", [~tired, sad, justrested], "{2*checkin/stillTired}"]
    - templates:
        "*":
          - "{Feel like you w/W}ant to do {something/something now/stuff now/anything}?"
          - "Are you {feeling /}{well/good/ok} enough to do something{3* now/}?"
      opts:
        - ["{Yeah/Yes/Sure}", [~tired], "$RecommendOs"]
        - ["$ABit", [~tired], what2do]
        - ["{Still tired/Tired again}", [justrested], stillTired]
        - ["{No/Not much/Not really}", [~tired, sad, justrested], "{3*checkin/stillTired}"]

  stillTired:
    - templates:
        "nottired":
          - "Even if you're not tired, {resting/taking a break} can be {beneficial/useful/helpful}."
          - "{Resting/Taking a break} can still help you."
        "-reststatus?stilltired":
          - "2*You aren't obligated to {always/constantly} {do/be doing} {2*something/stuff/things}, a {short/quick/small} {rest/break} {is nothing/won't hurt}."
          - "You don't need to do {2*something/2*anything/stuff} right now, a {short/quick/small} {rest/break} {is nothing/won't hurt}."
      opts:
        - ["Ok, {2*I'll /}rest", [], rest]
        - ["{Already rested/Rested too much}", [~tired, trytask], comfort2]
        - ["Just can't", [trytask], comfort2]
        - ["Something else", [sad], checkin]
        - ["{I'm ok/Don't need/It's ok}", [~tired], what2do]

    - templates:
        "!nottired":
          - "3*That's {alright/okay/fine/ok}, {2*take your time/there's no rush/there's no hurry}."
          - "Resting{'s/2* is} {still/}{good/useful/beneficial}, even if you{'re not/ aren't} tired."
        "justrested":
          - "You can always rest more if you want."
          - "You can always take a longer {rest/break} if you want."
      opts:
        - ["{Rest again/More rest/Keep resting}", [], rest]
        - ["{2*Can't rest/Not tired}", [nottired]]
        - ["{Not working/Still tired}#justrested", [stilltired]]
        - ["{Something else/It's not that,}", [sad], checkin]
        - ["{I'm ok/Don't need/It's ok}", [~tired], what2do]

  encourage:
    # Keep it up! / You've got this!
    - templates:
        "+problem?stuck?depressed":
          - "2*No matter how {hard/difficult/impossible} {2*things/it/everything} may {2*seem/appear}, {I know you've got this/I know you can do this/2*I believe in you}!"
          - "2*Even if {2*things/it/everything} {seems/appears} {hard/difficult/impossible}, {I know you've got this/I know you can do this/2*I believe in you}!"
        "+?sad, !depressed, !stressed":
          - "2*I know how {2*strong/2*resilient/amazing/awesome} you can be, so I {know/believe} {you can do it/it'll end out ok/you've got this}!"
        "unsure?stuck":
          - "3*You{'ll/ will/2* can} {get to great places/do amazing things}{2*, I believe in you/, I know you can/, I know you can do it/3*}!"

        "=":
          - "2*{Nice/Good/Great/Amazing/Excellent/Awesome} {work/job}{, k/! K}eep it up!"
          - "You're {going/doing} {great/well/awesome/amazing}{, k/! K}eep it up!"
          - "Keep {going/doing} {great/well/awesome/amazing}!"

        "*":
          - "2*I believe in you! Keep going{ strong!/, I know you can do it!/, you're doing well!/, you're doing so well!}"
          - "You{2*'ve got this/ can do this}!"
      opts:
        - ["{Thanks/Thanks!/Thanks,/3*Ok!}", [happy, justworked], progress]
        - ["{I'll try/Hope so}", [], progress]
        - ["$Unsure", [unsure], suggest]
        - ["$Stuck", [stuck], comfort]
        - ["{I can't/I'm not/I don't have this/Not doing well/Not going good}", [sad], checkin]

  suggest:
    - templates:
        "!resuggested":
          - "@ Maybe you could {do/try/aim for} '%best_name'?"
          - "@ How about {doing/trying/aiming for} '%best_name'?"
      opts:
        - ["{Sure/Ok/Yeah/Alright}!", [starting], encourage]
        - ["Maybe", [], maybe]
        - ["Why?", [], whynot]
        - ["{No/Not really/No thanks/Not feeling it}", [resuggested], suggest]

    - templates:
        "resuggested":
          - "@ {Ok{ then/}, h/H}ow about '%best_name'{ instead/}?"
          - "@ {That's {fine/ok}{,/. So,} w/W}hat about '%best_name'{ instead/}?"
          - "@ {What/How} about '%best_name'{ instead/}?"
      opts:
        - ["{Sure/Ok/Yeah/Alright}!", [starting], encourage]
        - ["Maybe", [], maybe]
        - ["Why?", [], whynot]
        - ["{No/Not really/No thanks/Not feeling it}", [], checkin]


dictionary:
  Going: "{going/coming along/holding up}"
  ThisDay: " %thistime/ today/ your day/ your %time"
  Been: "{2*been/gone down/gone}"
  Quick: "{short /quick /small /2*}"

  Hi: "Hiya/Heya/Hi/Hello"
  ABit: "{A bit/A little/Slightly/Somewhat}"
  ClearMind: "{2*clear your mind/take your mind off things/take your mind off things for a bit}"
  WantDone: "{2*want/would like} to {do/2*get done/accomplish/achieve}"

  DoneStuff: "Are you {going well/making progress}{ %thistime/2* today/3*}?"
  WantBreak: "{Do you want/Would you like}{ to take/ to have/4*} a $Quick{break/rest}"
  AhNotBest: "{Ah, t/Ah. T/2*T}hat's not {ideal/good/the best}."
  NotBest: "Not {2*the best/2*good/too good/well}"
  ButSeriously: "But {really/seriously}, how are you{ going/ feeling/}?"

  Sleeping: "{Resting/Sleeping}"
  Working: "{Working hard/Doing things/Achieving}"
  Chilling: "{Chillaxing/Relaxing}"
  Unsure: "{3*Deciding/Unsure/2*Aimless/2*Undecided/Lost}"
  Stuck: "{Stuck/Need help/Hit a wall}"
  Tired: "{Tired/Life's tiring/So tired/Exhausted}"
  Stressed: "{Stressed/A bit stressed/Anxious/Life's stressful}"
  Struggle: "{I'm struggling/I'm feeling off/It's difficult}"

  AllGoodOs: "{3*progress/3*what2do/encourage}"
  RecommendOs: "{suggest/what2do}"
