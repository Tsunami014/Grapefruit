groups:
  mood: [depressed, sad, relaxed, happy] # no mood can also be "ok"
  problem: [tired, stressed, bored]
  uncertainty: [unsure, stuck, motivated]

  ~reststatus: [justrested, nottired, stilltired]
  ~maybestate: [justmaybied, justwhyd]
  ~checkstate: [justchecked]
  ~committed: [juststarted, startedelse]
  suggeststate: [resuggested]
  comforttry: [triedrest, triedtask, triedsmaller, trieddiff triedlater]
  ~comfortstate: [nogeneric, tryany, forcegeneric]


initial: [2*sayhi, what2do]
reset: [sayhi, progress, what2do]


purposes:
  sayhi:
    # How is it going?
    - templates:
        "*":
          - "{$Hi}! How{2* are you/2* is it/'s it} $Going?"
          - "{$Hi}! How{'s/ is}{$ThisDay} $Going?"
          - "How{ are you/ is it/'s it} $Going{4*/$ThisDay}?"
          - "How{ is/'s}{3* everything/$ThisDay} $Going?"
          - "How{'s/ is} your {%time/day}?"
      opts:
        - ["{Pretty good/Great/Good/Nice}!", [happy], "{2*progress/goingwell}"]
        - ["$WantSomething", [], suggest]
        - ["{2*Ok/2*Alright/Meh/}", [-mood], checkin]
        - ["$NotBest", [sad], checkin]
        - ["{2*Terrible/Awful}", [depressed], checkin]

    # What are you up to?
    - templates:
        "*":
          - "2*{$Hi}! I was {2*%scene/just %scene/%scene just now}, what are you {up to/doing}?"
          - "What {10*are /}you up to?"
          - "What {10*are /}you {working on/planning/doing} {right now/now/2*%thistime/today}?"
          - "What{2* are your plans/ is the plan/'s the plan}{5* for %thistime/ %thistime}?"
      shuffle: true
      opts:
        - ["{Resting/Sleeping}", [tired], comfort]
        - ["$Working", [motivated], goingwell]
        - ["$Chilling", [relaxed], suggest]
        - ["{Nothing/Nothing much/Not much}", [], suggest]
        - ["{4*Struggling/2*Wasting time/2*Getting nowhere/2*Avoiding stuff/Procrastinating}", [sad], comfort]

    # What's up?
    - templates:
        "*":
          - "3*{$Hi/3*Good %time}! What's up?"
          - "{8*What's /Wass}up?"
          - "{$Hi}! Anything new?"
          - "What's {going on} today?"
      shuffle: true
      opts:
        - ["{Going pretty/2*Going/2*Pretty} {well/good/great}", [happy], "{2*progress/goingwell}"]
        - ["{Nothing much/2*Not much/3*Nothing/Nothing new}", [], suggest]
        - ["$NotBest", [sad], checkin]
        - ["Going {poorly/terribly/awfully}", [depressed], checkin]
        - ["$Working", [motivated], goingwell]
        - ["$Chilling", [relaxed], "{progress/suggest}"]
        - ["{The sky/The clouds/30*}", [], haha]
  haha:
    # Laugh at a joke
    - templates:
        "*":
          - "Ha{ha/ ha/}{! V/, v}ery funny{./!} $ButSeriously"
          - "Good one! $ButSeriously"
          - "Very funny{!/.} $ButSeriously"
      shuffle: true
      opts:
        - ["$NotBest", [sad], checkin]
        - ["{Mid/2*{Just o/O}k/2*{Just f/2*F}ine/Not bad/3*}", [-mood], "{suggest/checkin}"]
        - ["{Well/Great/Awesome}", [happy], progress]
        - ["$Working", [motivated], goingwell]
        - ["$Chilling", [relaxed], progress]

  progress:
    # How's your work coming along?
    - templates:
        "*":
          - "How {8*are /}you {going/coming along/holding up/running}?"
          - "2*How{'s/ is} {your work/it/it all/2*everything} $Going?"
          - "How are your {2*tasks/projects} $Going?"
      shuffle: true
      opts:
        - ["{Terribly/Poorly}", [depressed], checkin]
        - ["{Nothing to do/2*Got no{ work/thing}/Nothing on}", [], suggest]
        - ["$Stuck", [stuck], comfort]
        - ["$NotBest", [sad], checkin]
        - ["{2*Ok/2*Alright/Meh/Getting there}", [-mood], checkin]
        - ["{Smoothly/Excellent/Great/Well}!", [happy], goingwell]

    # How's work sitting with you?
    - templates:
        "!happy, !relaxed":
          - "How{'s/ is} {your /5*}work {feeling/sitting with you} {%thistime/today}?"
          - "Where{'s/ is} {your /5*}work {at/sitting} {%thistime/today}?"
        "happy":
          - "2*{Are y/Y}our {2*tasks/projects} $Going {5*well/good/nicely}?"
        "relaxed":
          - "2*{2*Is everything/Are your tasks/Is your work} going {well/nicely/good}?"
      opts:
        - ["{Nothing to do/Got no work/Nothing on}", [], suggest]
        - ["{I wish/4*$Stuck}", [stuck], comfort]
        - ["{Bored/5*}", [bored], suggest]
        - ["{Nope/No}", [stuck], checkin]
        - ["{A bit/Not much}", [-mood], "{2*suggest/comfort/checkin}"]
        - ["{Yup/Yeah/Yes/Heaps}!", [happy], goingwell]

  what2do:
    # What do you want to do?
    - templates:
        "*":
          - "What do you {want to do/want to accomplish/feel like doing}{/ %thistime/ today/ now}?"
          - "What{'s your goal/ are your goals} for {today/%thistime}?"
          - "Anything you{'d like/ want} $WantDone{ today/ %thistime/}?"
          - "Anything you feel like {doing/aiming for}{ today/ %thistime/}?"
          - "{Got/Have} {something/anything} in mind {for/to do} {today/%thistime/now}?"
      opts:
        - ["{Nothing/Not much}", [], suggest]
        - ["$Struggle", [sad, stuck], checkin]
        - ["{Sleep/Rest/}", [tired], comfort]
        - ["$Unsure", [unsure], suggest]
        - ["{2*Work/2*Productivity/Good things}", [motivated], goingwell]

    # Is there anything you want to do?
    - templates:
        "*":
          - "{3*Is there a/A}nything you {2*want/would like} $WantDone{/ %thistime/ today/ now}?"
          - "Feel like doing {something/anything}{/ %thistime/ today/ now}?"
        "relaxed?happy":
          - "2*{Got a/A}nything you {want/would like} $WantDone?"
      opts:
        - ["{No/Not really/Nope}", [], suggest]
        - ["$Struggle", [sad, stuck], checkin]
        - ["{Sleep/Rest/}", [tired], comfort]
        - ["$Unsure", [unsure], suggest]
        - ["{Yes/Yep/Definitely!}", [motivated], progress]

    # What would make now worth it?
    - templates:
        "*":
          - "What{'d/2* would} make {the next {5/10} minutes/right now} {feel /seem /}worth{ it/2*while}?"
          - "What would it take for {the next {3/5/10} minutes/right now} to feel worth{ it/while/ doing}?"
      shuffle: true
      opts:
        - ["{Dunno/Don't know/Unsure}", [], suggest]
        - ["{Sleep/Rest/}", [tired], comfort]
        - ["{Got plans/I know/2*Already {know/chosen}}", [motivated, startedelse, $reset_best], goingwell]
        - ["$Struggle", [sad, stuck], checkin]

  checkin:
    # Why are you sad?
    - templates:
        "!happy, !relaxed, +mood":
          - "{What's/Anything} wrong?"
          - "Anything {troubling/bothering} you{right now/6*}?"
          - "2*{What's/Anything/What is} {the matter/on your mind}?"
        "depressed":
          - "5*What{'s/ is} {3*troubling/3*bothering/saddening/2*upsetting} you?"
      shuffle: true
      opts:
        - ["$Tired", [tired, justchecked], comfort]
        - ["$Stressed", [stressed, justchecked], comfort]
        - ["{Bored/Nothing to do}", [bored, justchecked], suggest]
        - ["$Unsure", [unsure, justchecked], suggest]
        - ["$Stuck", [stuck, justchecked], comfort]
        - ["{Nothing/Nothing's wrong/I'm good/All good/All's good}", [-mood, -uncertainty, justchecked], "$AllGoodOs"]

    # Anything wrong?
    - templates:
        "sad?+problem":
          - "{Anything/Is something/Is anything} {2*wrong/off}?"
          - "{3*Are y/Y}ou {all /}good?"
      shuffle: true
      opts:
        - ["$Stuck", [stuck, justchecked], comfort]
        - ["$Unsure", [unsure, justchecked], suggest]
        - ["$Tired", [tired, justchecked], comfort]
        - ["$Stressed", [stressed, justchecked], comfort]
        - ["{Bored/Nothing to do}", [bored, justchecked], suggest]
        - ["{All's good/Doing well}!", [happy, -problem, justchecked], "$AllGoodOs"]

    # How are you going?
    - templates:
        "!depressed, !sad":
          - "How are things {going/coming along}?"
          - "3*How{ are you/ is it/'s it} {going/coming along/holding up}?"
          - "How{'s/ is} {life/the world/everything} treating you?"
      shuffle: true
      opts:
        - ["{Not/Not going} good", [sad]] # Leads to one of the other ones with more options
        - ["$Stuck", [stuck], comfort]
        - ["$Unsure", [unsure, justchecked], suggest]
        - ["{2*Great/2*Awesome/2*Doing well/I've got this}!", [happy, -problem, justchecked], "$AllGoodOs"]

  checkintask:
    # All good?
    - templates:
        "*":
          - "{Is e/E}verything {ok/alright}, or do you {just /}want something {else/different}{ instead/}?"
          - "Is {something up/anything the matter}, or are you {just /}{2*{looking/searching} for/wanting} something {else/different}{ instead/}?"
      shuffle: true
      opts:
        - ["$Stuck", [stuck], comfort]
        - ["$Tired", [tired], comfort]
        - ["$Stressed", [stressed], comfort]
        - ["$CantWork", [], maybe]
        - ["{I'm ok/Nothing wrong/Still {looking/searching}/Keep suggesting}", [justchecked], suggest]

  comfort:
    # Maybe take a break?
    - templates:
        "tired, !triedrest":
          - "3*{Maybe take/Try taking} a $Quick{break/rest} if you're tired{./?}"
          - "3*$WantBreak?"
        "stressed?depressed, !triedrest":
          - "2*$WantBreak{? It might make you feel better./, it may help?/?}"
          - "Sounds like you need a break{. It might make you feel better./, it may help./2*, {want/feel like} one?/.}"
        "stressed?stuck, !triedrest":
          - "2*{$AhNotBest /}Want a $Quick{break/rest} to help $ClearMind?"
          - "A $Quick{break/rest} might help {clear your head/{make /3*}you feel less stuck}, {want/feel like} one?"
        "+comforttry?tryany, !triedrest":
          - "$WantBreak?"
          - "{Well, w/W}hat about a $Quick{break/rest}?"
      opts:
        - ["{2*Sure/2*Ok/I guess}", [-comforttry], rest]
        - ["Maybe", [-comforttry], rest]
        - ["$Unhelpful", [-comforttry], stillTired]
        - ["{$NoToTask/Something else?}#-comforttry", [triedrest, nogeneric]]
        - ["{$NoToTask}#+comforttry", [-comforttry], comfortend]

    # Maybe do something else?
    - templates:
        "stuck, !triedtask":
          - "3*{$AhNotBest /}Want {a different goal/something else} to {2*help /}$ClearMind?"
          - "{How/What} about {switching to/doing} something {else/different} instead?"
        "depressed?stressed, !triedtask":
          - "2*{Sounds like/6*Do} you need something {new/different/more fun} to help $ClearMind?"
          - "Would something {{2*completely/totally} /}different {help/2*{be/feel} better} {3*right /}now?"
        "+comforttry?tryany, !triedtask":
          - "What about having {a different goal/something else} to work on to {help /}$ClearMind?"
          - "{2*Do you w/W}ant {a different goal/something else} to {help /}$ClearMind?"
      opts:
        - ["{Yeah/Ok/Sure/I guess}", [-comforttry], suggest]
        - ["Maybe", [-comforttry], suggest]
        - ["{$NoToTask/Something else?}#-comforttry", [triedtask, nogeneric]]
        - ["{$NoToTask}#+comforttry", [-comforttry], comfortend]

    # Try something similar instead
    - templates:
        "stuck?bored?stressed?depressed, !trieddiff":
          - "You don't {need/have to} do {exactly what the task is/the task exactly}, {what would make/why not try making/how would you make} it more {fun/engaging/interesting}?"
        "stressed?depressed?tired, !trieddiff":
          - "It's {ok/all right} if you {just /only /}do the task in a $DifferentWay{./3*, want to try?}"
        "+comforttry?tryany, !trieddiff":
          - "W{ell, w/}hat about doing the same task but in a $DifferentWay?"
      opts:
        - ["{Yeah/Ok/Sure/I guess}", [-comforttry, startedelse], goingwell]
        - ["Maybe", [-comforttry, justmaybied], maybe]
        - ["{$NoToTask/Something else?}#-comforttry", [trieddiff, nogeneric]]
        - ["{$NoToTask}#+comforttry", [-comforttry], comfortend]

    # Just do a little bit
    - templates:
        "depressed?stressed, !triedsmaller":
          - "{2*Even/Just} a {small/tiny} $PartOfDoing {2*would be fine/is enough}, {2*if that helps/no need for more}."
        "stuck?stressed?tired, !triedsmaller":
          - "Want to {just /only /}do a {smaller/shorter} $PartOfDoing{,/} instead of the {whole/entire} thing?"
        "+comforttry?tryany, !triedsmaller":
          - "{Want/{Well, h/H}ow about} just do a {smaller/shorter} $PartOfDoing instead?"
      opts:
        - ["{Yeah/Ok/Sure/I guess}", [-comforttry], suggest]
        - ["Maybe", [-comforttry], suggest]
        - ["{Don't want/Don't like} {this/it}", [-comforttry], suggest]
        - ["{$NoToTask/Something else?}#-comforttry", [triedsmaller, nogeneric]]
        - ["{$NoToTask}#+comforttry", [-comforttry], comfortend]

    # You can always come back to this later if you want
    - templates:
        "stuck?stressed, !triedlater":
          - "{No pressure/You don't have} to finish anything right now, do you want to {{just /} {leave/pause} whatever is stressing you for now/come back to whatever is stressing you later} and {2*focus on/do} something else{3* to $ClearMind/ for now/}?"
        "stuck?stressed?tired?depressed, !triedlater":
          - "You can always {come back to $WhateverDoing/pick up $WhateverDoing again} later, want to {leave/put} it aside for now?"
        "+comforttry?tryany, !triedlater":
          - "Want to just {leave/put} $WhateverDoing aside for {now/later/another time} instead?"
          - "{How/What} about coming back to $WhateverDoing {later/another time} instead?"
      opts:
        - ["{Yeah/Ok/Sure}", [-comforttry], suggest]
        - ["Maybe", [-comforttry], suggest]
        - ["{$NoToTask/Something else?}#-comforttry", [triedlater, nogeneric]]
        - ["{$NoToTask}#+comforttry", [-comforttry], comfortend]

    # Be there for the user (generic)
    - templates:
        "+?forcegeneric, -comforttry, !nogeneric":
          - "{I'm {so /9*}sorry{ ❤️/ :(/8*./8*/!}/It's {going to be /}ok{!/8*.}}"
      opts:
        - ["{2*Thanks/2*I appreciate it/Ok/2*Yeah/Yeah, probably/2*Probably}", [], what2do]
        - ["{So... what/So what now/What now}{?/}", [nogeneric]]
        - ["{It's n/N}ot ok{!/2*}#depressed", [nogeneric]]
        - ["{It's n/N}ot ok{!/2*}#!depressed", [sad, nogeneric]]

    # Fallback redirect
    - templates: { "=": ["> {suggest/what2do}"] }
  comfortend:
    # Nothing worked
    - templates:
        "*":
          - "Is there {anything/something} {troubling you{ in particular/}/on your mind}{, or {is everything ok/2*are you {all good/ok{ay/}}}/}?"
          - "{Are you {all good/ok{ay/}}? /}{Is/Was} there {just /}something in particular you were thinking of?"
      shuffle: true
      opts:
        - ["$Tired#!tired", [tired], rest]
        - ["$Stressed#!stressed", [stressed], comfort]
        - ["{Bored/Nothing to do}#!bored", [bored], suggest]
        - ["$Unsure#!unsure", [unsure], suggest]
        - ["$Stuck#!stuck", [stuck], comfort]
        - ["{Nothing's working/Not working/Something else}", [tryany], comfort]
        - ["{No/Nope/Nothing/Not bad}", [], "$AllGoodOs"]

  rest:
    - templates:
          "*":
            - "{Have a rest/Take a break} and come back {later/when you feel better}{!/.}"
      opts:
        - ["Done", [], afterRest]
        - ["{Still tired/2*$Unhelpful}", [tired, justrested], "{stillTired/comfort}"]
  afterRest:
    - templates:
        "*":
          - "2*{4*Are y/Y}ou feeling {any /}better{2*/ than before}?"
      opts:
        - ["{Yeah/Yes}", [~tired], what2do]
        - ["$ABit", [~tired], what2do]
        - ["{Still tired/Tired again}", [tired, justrested], "{stillTired/comfort}"]
        - ["{No/Not much/Not really}", [~tired, sad, justrested, tryany], "{2*checkin/{stillTired/comfort}}"]
    - templates:
        "*":
          - "{Feel like you w/W}ant to do {something/something now/stuff now/anything}?"
          - "Are you {feeling /}{well/good/ok} enough to do something{3* now/}?"
      opts:
        - ["{Yeah/Yes/Sure}", [~tired], "{suggest/what2do}"]
        - ["$ABit", [~tired], what2do]
        - ["{Still tired/Tired again}", [tired, justrested], "{stillTired/comfort}"]
        - ["{No/Not much/Not really}", [~tired, sad, justrested], "{3*checkin/{stillTired/comfort}}"]

  stillTired:
    - templates:
        "nottired":
          - "Even if you're not tired, {resting/taking a break} can be {beneficial/useful/helpful}."
          - "{Resting/Taking a break} can still help you."
        "-reststatus?stilltired":
          - "2*You aren't obligated to {always/constantly} {do/be doing} {2*something/stuff/things}, a {short/quick/small} {rest/break} {is nothing/won't hurt}."
          - "You don't need to do {2*something/2*anything/stuff} right now, a {short/quick/small} {rest/break} {is nothing/won't hurt}."
      opts:
        - ["Ok, {2*I'll /}rest", [], rest]
        - ["{Already rested/Rested too much}", [~tired, triedrest], comfort]
        - ["Just can't", [triedrest], comfort]
        - ["Something else", [sad], checkin]
        - ["{I'm ok/Don't need/It's ok}", [~tired], what2do]

    - templates:
        "!nottired":
          - "3*That's {alright/okay/fine/ok}, {2*take your time/there's no rush/there's no hurry}."
          - "Resting{'s/2* is} {still/}{good/useful/beneficial}, even if you{'re not/ aren't} tired."
        "justrested":
          - "You can always rest more if you want."
          - "You can always take a longer {rest/break} if you want."
      opts:
        - ["{Rest again/More rest/Keep resting}", [], rest]
        - ["{2*Can't rest/Not tired}", [nottired]]
        - ["{Not working/Still tired}#justrested", [stilltired]]
        - ["{Something else/It's not that,}", [sad], checkin]
        - ["{I'm ok/Don't need/It's ok}", [~tired], what2do]

  goingwell:
    # For when "Things are fine"
    - templates:
        "happy, -committed":
          - "{5*That's {super /}{great/awesome/fantastic/epic/amazing}/Love {that/it}}!"
          - "{2*That's/2*Really} {super /}{great/awesome/fantastic/epic/amazing} to hear!"
        "relaxed, -committed":
          - "{Nice/Good/Glad} {things are/it's} {calm/steady/easy going}{2*!/.}"
        "-committed":
          - "{Nice/Good/Glad} to hear{ it/}!"
          - "{Well, I'm h/2*I'm h/3*H}appy to hear {it's/you're/everything's} going {well/great/nicely}{2*!/.}"
          - "{2*Well, I'm g/Well, g/2*I'm g/G}lad {it's/you're/everything's} going {well/great/nicely}{2*!/.}"
      opts:
        - ["{Thanks/Yeah}!", [], what2do]
        - ["$IHope#!justchecked", [], checkin]
        - ["$IHope#justchecked", [forcegeneric], comfort]
        - ["{Actually, not really/Not great}", [sad], checkin]
        - ["{Unsure/2*Aimless/2*Undecided}", [], suggest]

    # Just committed to a task
    - templates:
        "+committed":
          - "$GotThis! {Even a little bit {still /}counts/Even if you don't finish it, starting is all that matters}."
          - "$GotThis{!/.} $NoPressure though, {don't forget /and {always /3*}remember{,/} /3*}you can {always /}$StopWhenWant."
          - "Do {what you {can/feel like}/as much or as little as you {want/feel{ like/}}}, you don't have to do {much/everything}."
          - "$GotThis, even if just {for the/}{start/first {little /2*}bit}. $NoPressure{!/.}"
        "sad?depressed?stressed?tired, +committed":
          - "{No pressure at all/Take it easy on yourself}, {2*even/just} {opening/looking at/2*starting} $TaskNam is enough for now."
          - "You don't {have/need} to do much{ at all/}, {2*just having it in mind is fine/even a glance counts}."
        "motivated?happy, +committed":
          - "2*$GotThis!"
        "juststarted":
          - "4*%best_reason"
      opts:
        - ["{Thanks/Thanks/Ok}{!/}", [], working]
        - ["$IHope#!justchecked", [], checkin]
        - ["$IHope#justchecked", [forcegeneric], comfort]
        - ["$CantWork", [], maybe]
        - ["{I can't/I'm not/3*Not {doing/going} {well/good}}", [sad], checkin]

  working:
    # Come back when you've finished working
    - templates:
        "*":
          - "{Well, s/S}ee you {later/soon}{{,/} then/}!"
          - "Go for it{2*, and I'll s/, s/! S}ee you {soon/later}!"
          - "{2*Enjoy/Good luck}!"
          - "{Catch you/Talk to you} {later/soon}!"

  suggest:
    - templates:
        "!resuggested":
          - "@ Is now a good time for '%best_name'?"
          - "@ {Do you feel like/Are you up for} doing '%best_name'{ now/ for now/}?"
        "resuggested":
          - "2*@ $NoProblem{{, w/! W}hat about/{, h/! H}ow about} '%best_name'$Instead?"
          - "2*@ $NoProblem{{, d/! D}o you feel like/{, a/! A}re you up for} '%best_name' instead?"
          - "@ $NoProblem{, i/! I}s now a better time for '%best_name'{ instead/}?"
      opts:
        - ["$ChosenAlready", [-suggeststate, startedelse, $reset_best], goingwell]
        - ["{Sure/Ok/Yeah/Alright}", [-suggeststate, juststarted], goingwell]
        - ["{Maybe/Don't know}{/?/...}", [], "{4*maybe/whytask}"]
        - ["$CantWork", [$reset_best], maybe]
        - ["{$NoToTask}#!resuggested", [resuggested], suggest]
        - ["{Still no/$NoToTask}#resuggested", [-suggeststate], checkintask]

  maybe:
    - templates:
        # What about only doing a bit?
        "*":
          - "{Well, w/W}hat if you {just /only /instead /}{did $TaskNam for/gave $TaskNam} {a short time/{2/3/5} minutes}? $NoPressure."
          - "$NoPressure, {what/how} about just {starting/doing/} {6*the first {small /}{bit/part}{s/2*} of /}$TaskNam?"
          - "{3*You don't have to do much, w/W}hat about just {starting/working on} {6*a small {section/part/bit} of /}$TaskNam?"
        # Only do it if you want
          - "{2*{Totally/Completely} fine/2*No worries/Not a problem} if you don't want to do $TaskNam, {only do it if you want/there's no pressure/don't stress {over/about} it}."
          - "{2*Don't {worry/stress}, y/Y}ou {2*don't {have/need} to/aren't forced to}{ do/} $TaskNam if you don't want to."
        # No obligation
          - "2*{There's no {requirement/need}/3*You {2*don't {need/have}/aren't forced}} to {2*finish/2*complete/do all of} it{{2* if/} you don't want to/}{, doing anything is ok/, any amount is fine/}{!/.}"
          - "{2*<'%best_name'/>It/The task} doesn't {have/need} to be {finished/completed/{completely /entirely /3*}done}{, {only /you can{2* just/ instead/2*} /just /}do whatever you feel like/, however much you do is {fine/ok/great}}{./!}"
        # Do something else too
          - "{Want to/Maybe try/2*{How/What} about} doing $TaskNam some way that {feels more {exciting/interesting}/doesn't feel {boring/annoying/like a job}}?{ Maybe {listen to music/do it while walking}?/}"
          - "{What/How} about {doing/trying} $TaskNam with {something/music} you enjoy so it {doesn't feel/feels less} {boring/annoying/2*like {just work/work/2*a chore}}?"
          - "Try changing up $TaskNam {a bit/however you feel/however works for you}{2*! I/. I/, i}t can be done however you desire{!/.}"
        # Fuel for later
          - "You don't {even /}{have/need} to do $TaskNam properly, just something {for later/for when you feel more motivated/more than nothing}{ would be ok/ is good/}."
          - "{Doesn't have to {count as/2*be}/You don't even have to do} {the whole thing/anything big}, just {something/something small/a rough version}{ to build on/} for {when you're more up for it/when you{'re feeling/ feel} more {up for it/motivated}/later}."
          - "Even a {half-{done/finished}/incomplete/basic} {attempt/shot} at $TaskNam is {useful/something} for later, you {don't have/aren't forced} to do {much/anything big}."
        # Stop anytime
          - "{You can/Feel free to/You're {absolutely /}free to} $StopWhenWant."
          - "2*You can just {give $TaskNam a {look/glance/try/shot}/try $TaskNam out/make a start on $TaskNam} and $StopWhenWant."
          - "{Start/Try} $TaskNam and $StopWhenWant."
        # Just try it to see
          - "You don't even have to {do/start/finish} anything, just {2*open it {and/to}{ try/}/try and} $SeeIfWant."
          - "{Just t/T}ake a quick {look/glance} at $TaskNam to $SeeIfWant{, y/. Y}ou{ don't need to do/'re not committing to} {anything /any /}more{ yet/}."
          - "{{Just o/O}pen/Glance at/Take a quick look at} $TaskNam and $SeeIfWant, {that's all{ you have to do/}/2*you don't {need/have} to do anything {more/else}}."
        # Try it as something you enjoy
          - "Think {for a {bit/while}/}about how you would {try/go for} $TaskNam the {3*same /}way you{'d/ would} approach $SomethingFun."
          - "{What if you treated/How about try treating} $TaskNam {like/the same as/as} $SomethingFun instead of {work/a task/a chore}?"
          - "{Try approaching/Approach/How about try/Try/Try going for/Go for} $TaskNam the same way you{'d/ would} {approach/try/go about} $SomethingFun."
        # Something related instead
          - "2*{Is there/Maybe there's/Try finding} something {related to/{that /}you could do {instead /}for} $TaskNam $RatherDo"
          - "{2*What if {instead, doing/you instead did}/How about instead{,/} doing} something {2*{related/similar} to/for} $TaskNam $RatherDo"
      opts:
        - ["$ChosenAlready", [-suggeststate, startedelse, $reset_best], goingwell]
        - ["{Sure/Ok/I guess/Alright/Doable}", [-suggeststate, juststarted], goingwell]
        - ["{But why/Why{ should I/ though/4*}}{/?}#-maybestate", [justmaybied], whytask]
        - ["{{Still m/M}aybe{/?/...}/{Still d/D}on't know{/./...}}#!justmaybied", [justmaybied], "{8*maybe/whytask}"]
        - ["{Still don't know/Not helping/{Maybe t/T}ry another}#justmaybied, !resuggested", [resuggested], suggest]
        - ["{Still don't know/Not helping}#justmaybied, resuggested", [unsure, -suggeststate], checkintask]
        - ["{$NoToTask}#!resuggested", [resuggested], suggest]
        - ["{Still no/$NoToTask}#resuggested", [unsure, -suggeststate], checkintask]

  whytask:
    # User entered reason
    - templates:
        "*":
          - "3*%best_reason{2*./!/2*}"
          - "2*%best_reason{. B/! B/, b}ut remember{,/} you {aren't forced/do{n't/ not} {need/have}} to do it if you don't want{ to/}{2*./!/2&}"
          - "%best_reason{. B/! B/, b}ut remember{,/} {there's /}no pressure{3* to {finish/complete} anything{2*{ if/} you don't want{ to/}/}{2*./!/2&}"
          - "%best_reason{. N/! N/ - n/, n}o pressure though{,/ -} you can always $StopWhenWant{2*./!/2*}"
        "=": # In case the user didn't put a reason, redirect back to maybe
          - "> maybe"
      opts:
        - ["$ChosenAlready", [-suggeststate, startedelse, $reset_best], goingwell]
        - ["{Sure/Ok/I guess/Alright/Doable}", [-suggeststate, juststarted], goingwell]
        - ["{Maybe/Don't know}{/?/...}#!justmaybied", [justwhyd], maybe]
        - ["{Still don't know/Not helping/{Maybe t/T}ry another}#justmaybied, !resuggested", [resuggested], suggest]
        - ["{Still don't know/Not helping}#justmaybied, resuggested", [unsure, -suggeststate], checkintask]
        - ["{$CantWork/}#!justmaybied", [$reset_best, justmaybied], maybe]
        - ["{$NoToTask}#!resuggested", [resuggested], suggest]
        - ["{Still no/$NoToTask}#resuggested", [unsure, -suggeststate], checkintask]


