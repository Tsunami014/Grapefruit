groups:
  mood: [depressed, sad, relaxed, happy]
  problem: [tired, stressed, bored, excited]
  uncertainty: [unsure, stuck, motivated]
  time: "time_of_day"
  thistime: "this_time_of_day"
  scene: "scene"

initial: [sayhi]
reset: [sayhi, progress]

purposes:
  sayhi:
    # How is it going?
    - templates:
        "*":
          - "{$Hi}! How{2* are you/2* is it/'s it} $Going?"
          - "{$Hi}! How{'s/ is}{$ThisDay} $Going?"
          - "How{ are you/ is it/'s it} $Going{4*/$ThisDay}?"
          - "How{ is/'s}{3* everything/$ThisDay} $Going?"
          - "2*How has{$ThisDay} $Been?"
          - "How{'s/ is/ was} your {%time/day}?"
      opts:
        - ["{Pretty good/Great/Good/Nice}!", [happy], "{2*progress/encourage}"]
        - ["{2*Ok/2*Alright/Meh}", [], checkin]
        - ["$NotBest", [sad], checkin]
        - ["{2*Terrible/Awful}", [depressed], checkin]

    # What are you up to?
    - templates:
        "*":
          - "{$Hi}! I{ was/'m}{ just/} %scene{ right now/}, what about you?"
          - "{$Hi}! I{ was/'m}{ just/} %scene{ right now/}, what {are/were} you {up to/doing}?"
          - "What {10*are /}you up to?"
          - "What {10*are /}you {working on/planning/doing} {right now/now/2*%thistime/today}?"
          - "What {2*are your plans/is the plan/'s the plan}{/5* for %thistime/2* %thistime}?"
      shuffle: true
      opts:
        - ["$Sleeping", [tired], comfort]
        - ["$Working", [motivated], progress]
        - ["$Chilling", [relaxed], suggest]
        - ["{Nothing/Nothing much/Not much}", [unsure], suggest]
        - ["{2*Struggling/2*Wasting time/2*Getting nowhere/I'm stuck/Avoiding stuff/Procrastinating}", [sad], checkin]

    # What's up?
    - templates:
        "*":
          - "3*{$Hi/3*Good %time}! What's up?"
          - "{8*What's /Wass}up?"
          - "{$Hi}! Anything new?"
          - "What's {going on} today?"
      shuffle: true
      opts:
        - ["Going {well/good/great/pretty ok}", [happy], "{2*progress/encourage}"]
        - ["{Nothing much/Not much/}", [], "{suggest/encourage}"]
        - ["$NotBest", [sad], checkin]
        - ["Going {poorly/terribly/awfully}", [depressed], checkin]
        - ["$Sleeping", [tired], comfort]
        - ["$Working", [motivated], "{progress/encourage}"]
        - ["$Chilling", [relaxed], "{5*progress/comfort}"]
        - ["{The sky/The clouds/30*}", [], haha]

  haha:
    # Laugh at a joke
    - templates:
        "*":
          - "Ha{ha/ ha/}{! V/, v}ery funny{./!} $ButSeriously"
          - "Good one! $ButSeriously"
          - "Very funny{!/.} $ButSeriously"
      shuffle: true
      opts:
        - ["$NotBest", [sad], checkin]
        - ["{Mid/2*Ok/2*Fine/Not bad/3*}", [], "{suggest/encourage}"]
        - ["{Well/Great/Awesome}", [happy], progress]
        - ["$Sleeping", [tired], comfort]
        - ["$Working", [motivated], "{progress/encourage}"]
        - ["$Chilling", [relaxed], progress]

  progress:
    # How's your work coming along?
    - templates:
        "*":
          - "2*How{3* are you/'s it/ is everything} $Going?"
          - "How{'s/ is} {the work/everything} $Going?"
          - "How are your {projects/tasks} $Going?"
      opts:
        - ["{Terribly/Poorly}", [depressed], checkin]
        - ["$Stuck", [stuck], "{checkin/comfort}"]
        - ["$NotBest", [sad], checkin]
        - ["{2*Ok/2*Alright/Meh/Getting there}", [], "{checkin/comfort}"]
        - ["{Smoothly/Excellent/Great/Well}!", [happy], encourage]

    # Done good work today?
    - templates:
        "*":
          - "How{'s/ is} {your /5*}work {going/coming along/treating you}? $DoneStuff"
          - "Is {your /5*}work {going good/going well/treating you well/being kind to you}{ %thistime/ today/}?"
          - "Are you managing to {get through stuff/survive work/do stuff/get stuff done} {%thistime/today}?"
          - "$DoneStuff"
      opts:
        - ["{Nothing to do/No work}", [], "{4*suggest/encourage/checkin}"]
        - ["{I wish/}", [unsure], "{2*suggest/comfort/checkin}"]
        - ["{Nope/None/No}", [], "{5*checkin/suggest}"]
        - ["{A bit/Not much}", [], "{2*suggest/comfort/checkin}"]
        - ["{Yup/Yeah/Yes/Heaps}!", [happy], encourage]

  checkin:
    # Why are you sad?
    - templates:
        "!happy, !relaxed":
          - "{What's/Anything} wrong?"
          - "Anything {troubling/bothering} you{right now/6*}?"
          - "2*{What's/Anything/What is} {the matter/on your mind}?"
        "depressed":
          - "5*What{'s/ is} {3*troubling/3*bothering/saddening/2*upsetting} you?"
      shuffle: true
      opts:
        - ["$Tired", [tired], comfort]
        - ["$Stressed", [stressed], comfort]
        - ["{Bored/Nothing to do}", [bored], suggest]
        - ["$Unsure", [unsure], "{suggest/comfort}"]
        - ["$Stuck", [stuck], "$StuckOs"]
        - ["{Nothing/Nothing's wrong/I'm good/All good/All's good}", [-mood, -uncertainty], "{2*progress/2*encourage/comfort/suggest}"]

    # How are you going?
    - templates:
        "!depressed, !sad":
          - "How are things {going/coming along}?"
          - "3*How{ are you/ is it/'s it} {going/coming along/holding up}?"
          - "How{'s/ is} {life/the world} treating you?"
      shuffle: true
      opts:
        - ["{Not/Not going} good", [sad]]
        - ["$Stuck", [stuck], "$StuckOs"]
        - ["$Unsure", [unsure], suggest]
        - ["$Tired", [tired], comfort]
        - ["{2*Great/2*Awesome/2*Doing well/I've got this}!", [happy, -problem], "$AllGoodOs"]

    # Anything wrong?
    - templates:
        "sad?-mood":
          - "{Anything/Is something/Is anything} {2*wrong/off}?"
          - "{3*Are y/Y}ou {all /}good?"
      shuffle: true
      opts:
        - ["$Stuck", [stuck], "$StuckOs"]
        - ["$Unsure", [unsure], "{3*suggest/comfort}"]
        - ["$Tired", [tired], comfort]
        - ["$Stressed", [stressed], comfort]
        - ["{Bored/Nothing to do}", [bored], suggest]
        - ["{2*Nope/All's good/Doing well}!", [happy, -problem], "$AllGoodOs"]

  comfort:
    # Suggest improvements for the user
    - templates:
        "tired":
          - "2*{Maybe take/Try taking} a $Quick{break/rest} if you're tired{2*./?}"
          - "2*{3*Do you want to/Should you} take a $Quick{rest/break}? You{3* seem/'re a bit} tired."
          - "I {like/enjoy} taking {a small break/small rests/short rests} occasionally{5*when I feel tired/when I feel tired like you/3*}, $TryIt?"
          - "{I sometimes/Sometimes, I} need to take a $Quick{rest/break} {5*when I feel tired/when I feel tired like you/3*}, $TryIt?"
        "*":
          - "I hope you get better soon"
      opts:

    # Be there for the user

  encourage:
    # Push the user to do more
    - templates:
        "*":
          - "Encouragement!"

    # Celebrate existing achievements

  suggest:
    - templates:
        "*":
          - "What do you want to do next?"
          - "Maybe you can do xyz?"

dictionary:
  Going: "{going/coming along/holding up/coming along}"
  ThisDay: " %thistime/ today/ your day/ your %time"
  Been: "{2*been/2*gone down/gone/held together}"

  Hi: "Hiya/Heya/Hi/Hello"
  NotBest: "Not {the best/2*good/too good/well/the best}"
  ButSeriously: "But {really/seriously}, how are you{ going/ feeling/}{2*now/right now/3*}?"

  Sleeping: "{Resting/Sleeping}"
  Working: "{Working hard/Doing things/Achieving}"
  Chilling: "{Chillaxing/Relaxing}"

  Unsure: "{3*Deciding/Unsure/2*Aimless/2*Undecided/Lost}"
  Stuck: "{Stuck/Need help/Hit a wall}"
  Tired: "{Tired/Life's tiring/So tired/Exhausted}"
  Stressed: "{Stressed/A bit stressed/Anxious/Life's stressful}"

  Quick: "{short /quick /small /2*}"
  TryIt: "{3*do you want to/3*would you like to/2*maybe you should/I think maybe/maybe just} try it"
  DoneStuff: "Are you {going well/making progress}{ %thistime/2* today/3*}?"

  StuckOs: "{suggest/comfort/encourage}"
  AllGoodOs: "{2*progress/2*encourage/suggest}"
