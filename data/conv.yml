groups:
  mood: [depressed, sad, relaxed, happy]
  problem: [tired, stressed, bored]
  uncertainty: [unsure, stuck, motivated]

  ~reststatus: [justrested, nottired, stilltired]
  ~comforttry: [docomfort, tryrest, trytask, nogeneric]
  ~maybestate: [justmaybied]
  ~commitstate: [juststarted]
  suggeststate: [resuggested]


initial: [2*sayhi, what2do]
reset: [sayhi, progress, what2do]


purposes:
  sayhi:
    # How is it going?
    - templates:
        "*":
          - "{$Hi}! How{2* are you/2* is it/'s it} $Going?"
          - "{$Hi}! How{'s/ is}{$ThisDay} $Going?"
          - "How{ are you/ is it/'s it} $Going{4*/$ThisDay}?"
          - "How{ is/'s}{3* everything/$ThisDay} $Going?"
          - "How{'s/ is} your {%time/day}?"
      opts:
        - ["{Pretty good/Great/Good/Nice}!", [happy], "{2*progress/goingwell}"]
        - ["$WantSomething", [], suggest]
        - ["{2*Ok/2*Alright/Meh/}", [], checkin]
        - ["$NotBest", [sad], checkin]
        - ["{2*Terrible/Awful}", [depressed], checkin]

    # What are you up to?
    - templates:
        "*":
          - "2*{$Hi}! I was {2*%scene/just %scene/%scene just now}, what are you {up to/doing}?"
          - "What {10*are /}you up to?"
          - "What {10*are /}you {working on/planning/doing} {right now/now/2*%thistime/today}?"
          - "What {2*are your plans/is the plan/'s the plan}{/5* for %thistime/2* %thistime}?"
      shuffle: true
      opts:
        - ["{Resting/Sleeping}", [tired], comfort]
        - ["$Working", [motivated], goingwell]
        - ["$Chilling", [relaxed], suggest]
        - ["{Nothing/Nothing much/Not much}", [], suggest]
        - ["{4*Struggling/2*Wasting time/2*Getting nowhere/2*Avoiding stuff/Procrastinating}", [sad], comfort]

    # What's up?
    - templates:
        "*":
          - "3*{$Hi/3*Good %time}! What's up?"
          - "{8*What's /Wass}up?"
          - "{$Hi}! Anything new?"
          - "What's {going on} today?"
      shuffle: true
      opts:
        - ["{Going pretty/2*Going/2*Pretty} {well/good/great}", [happy], "{2*progress/goingwell}"]
        - ["{Nothing much/2*Not much/3*Nothing/Nothing new}", [], suggest]
        - ["$NotBest", [sad], checkin]
        - ["Going {poorly/terribly/awfully}", [depressed], checkin]
        - ["$Working", [motivated], goingwell]
        - ["$Chilling", [relaxed], "{progress/suggest}"]
        - ["{The sky/The clouds/30*}", [], haha]
  haha:
    # Laugh at a joke
    - templates:
        "*":
          - "Ha{ha/ ha/}{! V/, v}ery funny{./!} $ButSeriously"
          - "Good one! $ButSeriously"
          - "Very funny{!/.} $ButSeriously"
      shuffle: true
      opts:
        - ["$NotBest", [sad], checkin]
        - ["{Mid/2*{Just o/O}k/2*{Just f/2*F}ine/Not bad/3*}", [], "{suggest/checkin}"]
        - ["$NotBest", [sad], checkin]
        - ["{Well/Great/Awesome}", [happy], progress]
        - ["$Working", [motivated], goingwell]
        - ["$Chilling", [relaxed], progress]

  progress:
    # How's your work coming along?
    - templates:
        "*":
          - "How {8*are /}you {going/coming along/holding up/running}?"
          - "2*How{'s/ is} {the work/your work/it/it all/2*everything} $Going?"
          - "How are your {2*tasks/projects} $Going?"
      shuffle: true
      opts:
        - ["{Terribly/Poorly}", [depressed], checkin]
        - ["{Nothing to do/2*Got no{ work/thing}/Nothing on}", [], suggest]
        - ["$Stuck", [stuck], comfort]
        - ["$NotBest", [sad], checkin]
        - ["{2*Ok/2*Alright/Meh/Getting there}", [], checkin]
        - ["{Smoothly/Excellent/Great/Well}!", [happy], goingwell]

    # How's work sitting with you?
    - templates:
        "*":
          - "How{'s/ is} {your /5*}work {feeling/sitting with you} {%thistime/today}?"
          - "Where{'s/ is} {your /5*}work {at/sitting} {%thistime/today}?"
        "happy":
          - "2*{Are y/Y}our {2*tasks/projects} $Going {5*well/good/nicely}?"
        "relaxed":
          - "2*{2*Is everything/Are the tasks/Is the work} going {smoothly/well/nicely/good}?"
      opts:
        - ["{Nothing to do/Got no work/Nothing on}", [], suggest]
        - ["{I wish/4*$Stuck}", [stuck], comfort]
        - ["{Bored/5*}", [bored], suggest]
        - ["{Nope/No}", [stuck], checkin]
        - ["{A bit/Not much}", [], "{2*suggest/comfort/checkin}"]
        - ["{Yup/Yeah/Yes/Heaps}!", [happy], goingwell]

  what2do:
    # What do you want to do?
    - templates:
        "*":
          - "What do you {want to do/want to accomplish/feel like doing}{/ %thistime/ today/ now}?"
          - "What{'s your goal/ are your goals} {for /}{today/%thistime}?"
          - "Anything you{'d like/ want} $WantDone{ today/ %thistime/}?"
          - "Anything you feel like {doing/trying/aiming for}{ today/ %thistime/}?"
          - "{Got/Have} {something/anything} in mind {for/to do} {today/%thistime/now}?"
      opts:
        - ["{Nothing/Not much}", [], suggest]
        - ["$Struggle", [sad, stuck], checkin]
        - ["{Sleep/Rest/}", [tired], comfort]
        - ["$Unsure", [unsure], suggest]
        - ["{2*Work/2*Productivity/Good things}", [motivated], progress]

    # Is there anything you want to do?
    - templates:
        "*":
          - "{3*Is there a/A}nything you {2*want/would like} $WantDone{/ %thistime/ today/ now}?"
          - "Feel like doing {something/anything}{/ %thistime/ today/ now}?"
        "relaxed?happy":
          - "2*{Got a/A}nything you {want/would like} $WantDone?"
      opts:
        - ["{No/Not really/Nope}", [], suggest]
        - ["$Struggle", [sad, stuck], checkin]
        - ["{Sleep/Rest/}", [tired], comfort]
        - ["$Unsure", [unsure], suggest]
        - ["{Yes/Yep/Definitely!}", [motivated], progress]

    # What would make now worth it?
    - templates:
        "*":
          - "What{'d/2* would} make {the next {5/10} minutes/right now} {feel /seem /} worth{ it/2*while}?"
          - "What{'d/2* would} it take for {the next {5/10} minutes/right now} to feel worth{ it/while/ doing}?"
      shuffle: true
      opts:
        - ["$Unsure", [unsure], suggest]
        - ["{Sleep/Rest/}", [tired], comfort]
        - ["{Got plans/I know/2*Already {know/chosen}}", [motivated], "{2*progress/goingwell}"]
        - ["$Struggle", [sad, stuck], checkin]

  checkin:
    # Why are you sad?
    - templates:
        "!happy, !relaxed":
          - "{What's/Anything} wrong?"
          - "Anything {troubling/bothering} you{right now/6*}?"
          - "2*{What's/Anything/What is} {the matter/on your mind}?"
        "depressed":
          - "5*What{'s/ is} {3*troubling/3*bothering/saddening/2*upsetting} you?"
      shuffle: true
      opts:
        - ["$Tired", [tired], comfort]
        - ["$Stressed", [stressed], comfort]
        - ["{Bored/Nothing to do}", [bored], suggest]
        - ["$Unsure", [unsure], suggest]
        - ["$Stuck", [stuck], comfort]
        - ["{Nothing/Nothing's wrong/I'm good/All good/All's good}", [-mood, -uncertainty], "$AllGoodOs"]

    # How are you going?
    - templates:
        "!depressed, !sad, !unsure":
          - "How are things {going/coming along}?"
          - "3*How{ are you/ is it/'s it} {going/coming along/holding up}?"
          - "How{'s/ is} {life/the world/everything} treating you?"
      shuffle: true
      opts:
        - ["{Not/Not going} good", [sad]]
        - ["$Stuck", [stuck], comfort]
        - ["$Unsure", [unsure], suggest]
        - ["$Tired", [tired], "{suggest/comfort}"]
        - ["{2*Great/2*Awesome/2*Doing well/I've got this}!", [happy, -problem], "$AllGoodOs"]

    # Anything wrong?
    - templates:
        "sad?unsure?-mood":
          - "{Anything/Is something/Is anything} {2*wrong/off}?"
          - "{3*Are y/Y}ou {all /}good?"
      shuffle: true
      opts:
        - ["$Stuck", [stuck], comfort]
        - ["$Unsure", [unsure], suggest]
        - ["$Tired", [tired], comfort]
        - ["$Stressed", [stressed], comfort]
        - ["{Bored/Nothing to do}", [bored], suggest]
        - ["{All's good/Doing well}!", [happy, -problem], "$AllGoodOs"]

  checkintask:
    # All good?
    - templates:
        "*":
          - "{Is e/E}verything {ok/alright}, or do you {just /}want something {else/different}{ instead/}?"
          - "Is {something up/anything the matter}, or are you {just /}{2*{looking/searching} for/wanting} something {else/different}{ instead/}?"
      shuffle: true
      opts:
        - ["$Stuck", [stuck], comfort]
        - ["$Tired", [tired], comfort]
        - ["$Stressed", [stressed], comfort]
        - ["{I'm ok/Nothing wrong/Still {looking/searching}/Keep suggesting}", [], suggest]

  comfort:
    # Maybe take a break?
    - templates:
        "tired":
          - "3*{Maybe take/Try taking} a $Quick{break/rest} if you're tired{./?}"
          - "3*$WantBreak?"
        "stressed?depressed?docomfort":
          - "2*$WantBreak{? It might make you feel better./, it may help?/?}"
          - "Sounds like you need a break{. It might make you feel better./, it may help./, want one?/.}"
        "stressed?stuck":
          - "2*$AhNotBest Want a $Quick{break/rest} to help $ClearMind?"
      opts:
        - ["{3*Sure/I guess}", [], rest]
        - ["Maybe", [], rest]
        - ["$Unhelpful", [], stillTired]
        - ["{Don't want to/2*No/No thanks/Not now/Something else?}", [trytask], comfort2]

    # Maybe do something else?
    - templates:
        "stuck":
          - "3*$AhNotBest Want {a different goal/something else} to {2*help /}$ClearMind?"
        "depressed?stressed?docomfort":
          - "2*{Sounds like/6*Do} you need something {new/different/more fun} to help $ClearMind?"
      opts:
        - ["{3*Sure/I guess}", [], "$RecommendOs"]
        - ["Maybe", [], suggest]
        - ["{Don't want to/2*No/No thanks/Not now/Something else?}", [tryrest], comfort2]

    # Be there for the user (generic)
    - templates:
        "+, !depressed, !nogeneric":
          - "{I'm {so /9*}sorry{ ❤️/ :(/8*./8*/!}/It's {going to be /}ok{!/8*.}}"
      opts:
        - ["{2*Thanks/2*I appreciate it/Ok/2*Yeah/Yeah, probably/2*Probably}", [], what2do]
        - ["{So... what/So what now/What now}{?/}", [nogeneric]]
        - ["{It's n/N}ot ok#depressed", [nogeneric]]
        - ["{It's n/N}ot ok#!depressed", [sad, nogeneric]]

    # Fallback redirect
    - templates: { "=": ["> $RecommendOs"] }

  comfort2:
    - templates:
        "tryrest":
          - "$WantBreak?"
          - "What about a $Quick{break/rest}?"
      opts:
        - ["{3*Sure/I guess}", [], rest]
        - ["Maybe", [], rest]
        - ["{Won't help/Not helpful/Unhelpful/2*Useless}", [], stillTired]
        - ["{Don't want to/2*No/No thanks/Not now}", [unsure], what2do]

    - templates:
        "trytask":
          - "{2*Do you w/W}ant {a different goal/something else} to {help /}$ClearMind?"
          - "What about having {a different goal/something else} to work on to {help /}$ClearMind?"
      opts:
        - ["{3*Sure/I guess}", [], "$RecommendOs"]
        - ["Maybe", [], suggest]
        - ["{2*No/No thanks/Not now}", [unsure], what2do]

    # Fallback redirect
    - templates: { "=": ["> comfort"] }

  rest:
    - templates:
          "*":
            - "{Have a rest/Take a break} and come back {later/when you feel better}{!/.}"
      opts:
        - ["Done", [], afterRest]
        - ["{Still tired/2*$Unhelpful}", [justrested], stillTired]
  afterRest:
    - templates:
        "*":
          - "2*{4*Are y/Y}ou feeling {any /}better{2*/ than before}?"
      opts:
        - ["{Yeah/Yes}", [~tired], what2do]
        - ["$ABit", [~tired], what2do]
        - ["{Still tired/Tired again}", [justrested], stillTired]
        - ["{No/Not much/Not really}", [~tired, sad, justrested], "{2*checkin/stillTired}"]
    - templates:
        "*":
          - "{Feel like you w/W}ant to do {something/something now/stuff now/anything}?"
          - "Are you {feeling /}{well/good/ok} enough to do something{3* now/}?"
      opts:
        - ["{Yeah/Yes/Sure}", [~tired], "$RecommendOs"]
        - ["$ABit", [~tired], what2do]
        - ["{Still tired/Tired again}", [justrested], stillTired]
        - ["{No/Not much/Not really}", [~tired, sad, justrested], "{3*checkin/stillTired}"]

  stillTired:
    - templates:
        "nottired":
          - "Even if you're not tired, {resting/taking a break} can be {beneficial/useful/helpful}."
          - "{Resting/Taking a break} can still help you."
        "-reststatus?stilltired":
          - "2*You aren't obligated to {always/constantly} {do/be doing} {2*something/stuff/things}, a {short/quick/small} {rest/break} {is nothing/won't hurt}."
          - "You don't need to do {2*something/2*anything/stuff} right now, a {short/quick/small} {rest/break} {is nothing/won't hurt}."
      opts:
        - ["Ok, {2*I'll /}rest", [], rest]
        - ["{Already rested/Rested too much}", [~tired, trytask], comfort2]
        - ["Just can't", [trytask], comfort2]
        - ["Something else", [sad], checkin]
        - ["{I'm ok/Don't need/It's ok}", [~tired], what2do]

    - templates:
        "!nottired":
          - "3*That's {alright/okay/fine/ok}, {2*take your time/there's no rush/there's no hurry}."
          - "Resting{'s/2* is} {still/}{good/useful/beneficial}, even if you{'re not/ aren't} tired."
        "justrested":
          - "You can always rest more if you want."
          - "You can always take a longer {rest/break} if you want."
      opts:
        - ["{Rest again/More rest/Keep resting}", [], rest]
        - ["{2*Can't rest/Not tired}", [nottired]]
        - ["{Not working/Still tired}#justrested", [stilltired]]
        - ["{Something else/It's not that,}", [sad], checkin]
        - ["{I'm ok/Don't need/It's ok}", [~tired], what2do]

  goingwell:
    # For when "Things are fine"
    - templates:
        "happy, !juststarted":
          - "{5*That's {super /}{great/awesome/fantastic/epic/amazing}/Love {that/it}}!"
          - "{2*That's/2*Really} {super /}{great/awesome/fantastic/epic/amazing} to hear!"
        "relaxed, !juststarted":
          - "{Nice/Good/Glad} {things are/it's} {calm/steady/easy going}{2*!/.}"
        "!juststarted":
          - "{Nice/Good/Glad} to hear{ it/}!"
          - "{Well, I'm h/2*I'm h/3*H}appy to hear {it's/you're/everything's} going {well/great/nicely}{2*!/.}"
          - "{2*Well, I'm g/Well, g/2*I'm g/G}lad {it's/you're/everything's} going {well/great/nicely}{2*!/.}"
      opts:
        - ["{Thanks/Yeah}!", [], what2do]
        - ["{Maybe/Hopefully/I hope}{.../?/}", [], checkin]
        - ["{Actually, not really/Not great}", [sad], checkin]

    # Just committed to a task
    - templates:
        "juststarted":
          # Even just the first little bit
          - "$GotThis! {Even a little bit {still /}counts/Even if you don't finish it, starting is all that matters}."
          - "$GotThis{!/.} $NoPressure though, {don't forget /3*}you can {always /}$StopWhenWant."
          - "$GotThis{!/.} {Just d/D}o {what you {can/feel like}/as much or as little as you {want/feel{ like/}}}, you don't have to do much."
          - "$GotThis, even if just {for the/}{start/first {little /2*}bit}. $NoPressure{!/.}"
      opts:
        - ["{Thanks/Thanks/Ok}{!/}", [], working]
        - ["{Maybe/Hopefully/I hope}{.../?/}", [], checkin]
        - ["{I can't/I'm not/3*Not {doing/going} {well/good}}", [sad], checkin]

  working:
    # Come back when you've finished working
    - templates:
          "*":
            - "{Well, s/S}ee you {later/soon}{{,/} then/}!"

  suggest:
    - templates:
        "!resuggested":
          - "@ Is now a good time for '%best_name'?"
          - "@ {Do you feel like/Are you up for} doing '%best_name'{ now/ for now/}?"
        "resuggested":
          - "2*@ $NoProblem{{, w/! W}hat about/{, h/! H}ow about} '%best_name'$Instead?"
          - "2*@ $NoProblem{{, d/! D}o you feel like/{, a/! A}re you up for} '%best_name' instead?"
          - "@ $NoProblem{, i/! I}s now a better time for '%best_name'{ instead/}?"
      opts:
        - ["$ChosenAlready", [-suggeststate, juststarted], goingwell]
        - ["{Sure/Ok/Yeah/Alright}", [juststarted], goingwell]
        - ["{Maybe/Don't know}{/?/...}", [], maybe]
        - ["{$NoToTask}#!resuggested", [resuggested], suggest]
        - ["{Still no/$NoToTask}#resuggested", [-suggeststate], checkintask]

  maybe:
    - templates:
        # What about only doing a bit?
        "*":
          - "{Well, w/W}hat if you {just /only /instead /}{did '%best_name' for/gave '%best_name'} {a short time/{2/3/5} minutes}? $NoPressure."
          - "$NoPressure, {what/how} about just {starting/doing/} {6*the first {small /}{bit/part} of /}'%best_name'?"
          - "{3*You don't have to do much, w/W}hat about just {starting/working on} {6*a small {section/part/bit} of /}'%best_name'?"
        # Only do it if you want
          - "{2*{Totally/Completely} fine/2*No worries/Not a problem} if you don't want to do '%best_name', {only do it if you want/there's no pressure/don't stress {over/about} it}."
          - "{2*Don't {worry/stress}, y/Y}ou {2*don't {have/need} to/aren't forced to}{ do/} '%best_name' if you don't want to."
        # No obligation
          - "2*{There's no {requirement/need}/3*You {2*don't {need/have}/aren't forced}} to {2*finish/2*complete/do all of} '%best_name'{{2* if/} you don't want to/}{, doing anything is ok/, any amount is fine/}{!/.}"
          - "'%best_name' doesn't {have/need} to be {finished/completed/{completely /entirely /3*}done}{, {only /you can{2* just/ instead/2*} /just /}do whatever you feel like/, however much you do is {fine/ok/great}}{./!}"
        # Do something else too
          - "{Want to/Maybe try/2*{How/What} about} doing '%best_name' some way that {feels more {exciting/interesting}/doesn't feel {boring/annoying/like a job}}?{ Maybe {listen to music/do it while walking}?/}"
          - "{What/How} about {doing/trying} '%best_name' with {something/music} you enjoy so it {doesn't feel/feels less} {boring/annoying/2*like {just work/work/2*a chore}}?"
          - "Try changing up '%best_name' {a bit/however you feel/however works for you}{2*! I/. I/, i}t can be done however you desire{!/.}"
        # Fuel for later
          - "You don't {even /}{have/need} to do '%best_name' properly, just something {for later/for when you feel more motivated/more than nothing}{ would be ok/ is good/}."
          - "{Doesn't have to {count as/2*be}/You don't even have to do} {the whole thing/anything big}, just {something/something small/a rough version}{ to build on/} for {when you're more up for it/when you{'re feeling/ feel} more {up for it/motivated}/later}."
          - "Even a {half-{done/finished}/incomplete/basic} {attempt/shot} at '%best_name' is {useful/something} for later, you {don't have/aren't forced} to do {much/anything big}."
        # Stop anytime
          - "{You can/Feel free to/You're {absolutely /}free to} $StopWhenWant."
          - "2*You can just {give '%best_name' a {look/glance/try/shot}/try '%best_name' out/make a start on '%best_name'} and $StopWhenWant."
          - "{Start/Try} '%best_name' and $StopWhenWant."
        # Just try it to see
          - "You don't even have to {do/start/finish} anything, just {2*open it {and/to} {try /}/try and } $SeeIfWant."
          - "{Just t/T}ake a quick {look/glance} at '%best_name' to $SeeIfWant{, y/. Y}ou{ don't need to do/'re not committing to} {anything /any /}more{ yet/}."
          - "{{Just o/O}pen/Glance at/Take a quick look at} '%best_name' and $SeeIfWant, {that's all{ you have to do/}/2*you don't {need/have} to do anything {more/else}}."
        # Try it as something you enjoy
          - "Think {for a {bit/while}/}about how you would {try/go for} '%best_name' the {3*same /}way you{'d/ would} approach $SomethingFun."
          - "{What if you treated/How about try treating} '%best_name' {like/the same as/as} $SomethingFun instead of {work/a task/a chore}?"
          - "{Try approaching/Approach/How about try/Try/Try going for/Go for} '%best_name' the same way you{'d/ would} {approach/try/go about} $SomethingFun."
      opts:
        - ["{Sure/Ok/I guess/Alright/Doable}", [-suggeststate, juststarted], goingwell]
        - ["{{Still m/M}aybe/{Still d/D}on't know}{/?/...}#-maybestate", [justmaybied], maybe]
        - ["{Still don't know/Not helping/{Maybe t/T}ry another}#+maybestate#!resuggested", [], suggest]
        - ["{Still don't know/Not helping}#+maybestate#resuggested", [unsure, -suggeststate], checkintask]
        - ["{$NoToTask}#justmaybied#!resuggested", [resuggested], suggest]
        - ["{Still no/$NoToTask}#resuggested", [unsure, -suggeststate], checkintask]


dictionary:
  Going: "{going/coming along/holding up}"
  ThisDay: " %thistime/ today/ your day/ your %time"
  Quick: "{short /quick /small /2*}"

  Hi: "Hiya/Heya/Hi/Hello"
  ABit: "{A bit/A little/Slightly/Somewhat}"
  ClearMind: "{2*clear your mind/take your mind off things/take your mind off things for a bit}"
  WantDone: "to {do/get done/aim for/try/take on}"
  ThatsOk: "{3*that's {3*{completely /}{fine/ok}/all good}/it's ok}"

  WantBreak: "{Do you want/Would you like}{ to take/ to have/4*} a $Quick{break/rest}"
  AhNotBest: "{Ah, t/Ah. T/2*T}hat's not {ideal/good/the best}."
  NotBest: "Not {2*the best/2*good/too good/well}"
  ButSeriously: "But {really/seriously}, how are you{ going/ feeling/ doing/}?"
  NoProblem: "{Sure/That's {totally /completely /}fine/{It's a/You're a/2*A}ll good/2*No {worries/problem}{ at all/2*}/Not a problem}"
  Instead: "{2* instead/}{2*, {is it/does it sound/sound} any better/}"
  NoPressure: "{2*{There's n/N}o {pressure/need}/You don't have} to {4*{finish/complete} {it all/the whole thing/everything}/get far}"
  GotThis: "{Go for it/You've got this/I believe in you/You can do {this/it}/You'll do great/I believe you{ can do/'ve got} this}"
  StopWhenWant: "stop {the {moment/second}/as soon as/when/anytime} {you no longer feel/you're no longer feeling} like {doing /}it{ anymore/}{3*, %ThatsOk/}"
  SeeIfWant: "see {2*if you {2*{are feeling/feel} like it/want to do it}/how it feels}"
  SomethingFun: "{2*something {fun/you enjoy}/a hobby}"

  WantSomething: "{Deciding/Aimless/2*Undecided/Want task}"
  Working: "{Working hard/Doing things/Achieving}"
  Chilling: "{Chillaxing/Relaxing}"
  Unsure: "{3*Deciding/Unsure/2*Aimless/2*Undecided/Lost}"
